apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phpldapadmin
  namespace: backstage
  labels:
    app.kubernetes.io/name: phpldapadmin
    backstage.uk/component: phpldapadmin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: /backstage/phpldapadmin/app-key
    - secretKey: LDAP_PASSWORD
      remoteRef:
        key: /backstage/openldap/secrets
        property: adminPassword
