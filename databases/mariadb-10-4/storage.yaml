apiVersion: v1
kind: PersistentVolume
metadata:
  name: backstage-database-mariadb-10-4
  labels:
    app.kubernetes.io/name: database-mariadb-10-4
    backstage.uk/component: database
    backstage.uk/engine: mariadb
    backstage.uk/version: '10.4'
    backstage.uk/storage-name: database-mariadb-10-4
  annotations:
    argocd.argoproj.io/sync-options: 'Delete=false,Prune=false'
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: aws-efs
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 5Gi
  csi:
    driver: efs.csi.aws.com
    volumeHandle: 'fs-05929b3d75352ac77::fsap-0361b21e64ee2c4fc'
    volumeAttributes:
      encryptInTransit: 'true'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-mariadb-10-4
  namespace: backstage
  labels:
    app.kubernetes.io/name: database-mariadb-10-4
    backstage.uk/component: database
    backstage.uk/engine: mariadb
    backstage.uk/version: '10.4'
    backstage.uk/storage-name: database-mariadb-10-4
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: aws-efs
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      backstage.uk/component: database
      backstage.uk/engine: mariadb
      backstage.uk/version: '10.4'
      backstage.uk/storage-name: database-mariadb-10-4
