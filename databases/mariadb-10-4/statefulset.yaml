apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database-mariadb-10-4
  namespace: backstage
  labels:
    app.kubernetes.io/name: database-mariadb-10-4
    backstage.uk/component: database
    backstage.uk/engine: mariadb
    backstage.uk/version: '10.4'
spec:
  serviceName: mariadb-10-4
  replicas: 1
  selector:
    matchLabels:
      backstage.uk/component: database
      backstage.uk/engine: mariadb
      backstage.uk/version: '10.4'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-mariadb-10-4
        backstage.uk/component: database
        backstage.uk/engine: mariadb
        backstage.uk/version: '10.4'
        bnjns.uk/owner: 'backstage'
    spec:
      containers:
        - name: mariadb
          image: mariadb:unknown
          imagePullPolicy: IfNotPresent
          env:
            - name: MARIADB_ROOT_HOST
              value: 'localhost'
          envFrom:
            - secretRef:
                name: database-mariadb-10-4
          resources:
            requests:
              memory: '256Mi'
            limits:
              memory: '512Mi'
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-mariadb-10-4
      nodeSelector:
        bnjns.uk/owner: 'backstage'
      tolerations:
        - key: 'bnjns.uk/reserved-for'
          operator: 'Equal'
          value: 'backstage'
          effect: 'NoSchedule'
