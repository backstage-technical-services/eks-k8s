apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-mariadb-10-4
  namespace: backstage
  labels:
    app.kubernetes.io/name: database-mariadb-10-4
    backstage.uk/component: database
    backstage.uk/engine: mariadb
    backstage.uk/version: '10.4'
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  data:
    - secretKey: MARIADB_ROOT_PASSWORD
      remoteRef:
        key: /backstage/database/mariadb-10-4
        property: MARIADB_ROOT_PASSWORD
