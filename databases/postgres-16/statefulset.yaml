apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database-postgres-16
  namespace: backstage
  labels:
    app.kubernetes.io/name: database-postgres-16
    backstage.uk/component: database
    backstage.uk/engine: postgres
    backstage.uk/version: '16'
spec:
  serviceName: postgres-16
  replicas: 1
  selector:
    matchLabels:
      backstage.uk/component: database
      backstage.uk/engine: postgres
      backstage.uk/version: '16'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-postgres-16
        backstage.uk/component: database
        backstage.uk/engine: postgres
        backstage.uk/version: '16'
        bnjns.uk/owner: 'backstage'
    spec:
      containers:
        - name: postgres
          image: postgres:unknown
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: '/var/lib/postgresql/data'
          envFrom:
            - secretRef:
                name: database-postgres-16
                optional: false
          resources:
            requests:
              memory: '1Gi'
            limits:
              memory: '2Gi'
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-postgres-16
      nodeSelector:
        bnjns.uk/owner: 'backstage'
      tolerations:
        - key: 'bnjns.uk/reserved-for'
          operator: 'Equal'
          value: 'backstage'
          effect: 'NoSchedule'
