apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-postgres-16
  namespace: backstage
  labels:
    app.kubernetes.io/name: database-postgres-16
    backstage.uk/component: database
    backstage.uk/engine: postgres
    backstage.uk/version: '16'
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /backstage/database/postgres-16
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: /backstage/database/postgres-16
        property: POSTGRES_USER
