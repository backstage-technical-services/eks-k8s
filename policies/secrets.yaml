apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: secrets
spec:
  rules:
    - name: no-cleartext-secrets
      match:
        any:
          - resources:
              kinds: ['Secret']
      validate:
        failureAction: Enforce
        message: 'Use an ExternalSecret instead of committing a Secret'
        pattern:
          type: 'kubernetes.io/service-account-token'
