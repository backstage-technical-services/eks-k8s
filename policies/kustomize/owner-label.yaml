apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: owner-label
spec:
  background: false
  rules:
    - name: owner-label
      match:
        any:
          - resources:
              kinds: ['*']
      validate:
        failureAction: Enforce
        message: 'Label every object with bnjns.uk/owner: backstage through Kustomize labels'
        pattern:
          metadata:
            labels:
              bnjns.uk/owner: 'backstage'
