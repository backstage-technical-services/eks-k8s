apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-10-4
  namespace: backstage-argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: backstage
  source:
    repoURL: https://github.com/backstage-technical-services/eks-k8s.git
    targetRevision: HEAD
    path: databases/mariadb-10-4
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
