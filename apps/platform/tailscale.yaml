apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: backstage-argocd
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  project: backstage
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.86.2
      helm:
        valueFiles:
          - $values/platform/tailscale/values.yaml
    - repoURL: https://github.com/backstage-technical-services/eks-k8s.git
      targetRevision: HEAD
      ref: values
      path: platform/tailscale
      directory:
        include: '{externalsecret.yaml,proxyclass.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage-tailscale
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
