apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: backstage
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: github-actions-service-account-token
  namespace: backstage
  annotations:
    kubernetes.io/service-account.name: github-actions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: 'backstage:github-actions'
rules:
  - apiGroups: ['']
    resources: ['persistentvolumes']
    verbs: ['*']
  - apiGroups: ['certificates.k8s.io']
    resources: ['certificatesigningrequests']
    verbs: ['create', 'get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: 'backstage:github-actions'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'backstage:github-actions'
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 'backstage:github-actions'
  namespace: backstage
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: 'backstage:github-actions'
  namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: 'backstage:github-actions'
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: backstage
