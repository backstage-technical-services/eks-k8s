apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 'backstage:admin'
  namespace: backstage
rules:
  - apiGroups: ['']
    resources: ['*']
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 'backstage:dev'
  namespace: backstage
rules:
  - apiGroups: ['']
    resources: ['*']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 'backstage:admin'
  namespace: backstage-tailscale
rules:
  - apiGroups: ['']
    resources: ['*']
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 'backstage:dev'
  namespace: backstage-tailscale
rules:
  - apiGroups: ['']
    resources: ['*']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['delete']
