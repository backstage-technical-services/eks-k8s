apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      bnjns.uk/owner: 'backstage'

resources:
  - rate-limit.yaml
  - redirect-http-to-https.yaml
  - ip-allowlist-internal.yaml
  - ip-allowlist-trusted-cron.yaml

configMapGenerator:
  - name: update-ip-allowlist-trusted
    namespace: backstage
    files:
      - update-ip-allowlist-trusted/fixed-ranges.txt
      - update-ip-allowlist-trusted/update.sh
    options:
      disableNameSuffixHash: true

images:
  - name: alpine/k8s
    newTag: '1.37.2'
