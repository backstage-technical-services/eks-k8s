apiVersion: v1
kind: ServiceAccount
metadata:
  name: update-ip-allowlist-trusted
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: update-ip-allowlist-trusted
  namespace: backstage
rules:
  - apiGroups: ['traefik.io']
    resources: ['middlewares']
    verbs: ['create']
  - apiGroups: ['traefik.io']
    resources: ['middlewares']
    resourceNames: ['ip-allowlist-trusted']
    verbs: ['get', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: update-ip-allowlist-trusted
  namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: update-ip-allowlist-trusted
subjects:
  - kind: ServiceAccount
    name: update-ip-allowlist-trusted
    namespace: backstage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-ip-allowlist-trusted
  namespace: backstage
spec:
  schedule: '0 1 * * *'
  timeZone: 'Europe/London'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: update-ip-allowlist-trusted
        spec:
          serviceAccountName: update-ip-allowlist-trusted
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: update
              image: alpine/k8s:unknown
              command: ['bash', '/config/update.sh']
              env:
                - name: HOME
                  value: '/tmp'
              resources:
                requests:
                  memory: '128Mi'
                limits:
                  memory: '128Mi'
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: update-ip-allowlist-trusted
            - name: tmp
              emptyDir: {}
          nodeSelector:
            bnjns.uk/owner: 'backstage'
          tolerations:
            - key: 'bnjns.uk/reserved-for'
              operator: 'Equal'
              value: 'backstage'
              effect: 'NoSchedule'
