apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: backstage-tailscale
  labels:
    bnjns.uk/owner: 'backstage'
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  data:
    - secretKey: client_id
      remoteRef:
        key: /backstage/tailscale-auth
        property: oauthClientId
    - secretKey: client_secret
      remoteRef:
        key: /backstage/tailscale-auth
        property: oauthClientSecret
